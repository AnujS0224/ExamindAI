# Server
server.port=${PORT:5000}
server.servlet.context-path=/api

# Optional local overrides (Ignored by Git for local development)
spring.config.import=optional:classpath:application-local.properties

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/examind_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:cdac}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload
spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=250MB

# JWT
app.jwt.secret=${JWT_SECRET:9a67479c46d5c6439c3e986a7d5b88219c67479c46d5c6439c3e986a7d5b8821}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Gemini AI
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}

# Groq AI
groq.api.key=${GROQ_API_KEY:your_groq_api_key_here}

# Gmail SMTP
spring.mail.properties.mail.smtp.localhost=localhost
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_mail_app_password_here}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your_google_client_id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret_here}
spring.security.oauth2.client.registration.google.scope=profile,email
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/callback}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5000/api/login/oauth2/code/google}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_cloudinary_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_cloudinary_api_secret}

# Internal Security & Services
app.internal.secret=${INTERNAL_API_SECRET:cdac_examind_secret_2026}
app.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:5001/api/payments}