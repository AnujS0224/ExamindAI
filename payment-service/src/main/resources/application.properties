# Server Configuration
server.port=${PORT:5001}
server.servlet.context-path=/api

# Optional local overrides (Ignored by Git for local development)
spring.config.import=optional:classpath:application-local.properties

# Database Configuration (Separate database for payment)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/examind_ai_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:cdac}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configurations (Must match monolith secret to decode)
app.jwt.secret=${JWT_SECRET:9a67479c46d5c6439c3e986a7d5b88219c67479c46d5c6439c3e986a7d5b8821}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Razorpay Keys loaded from environment variables with safe fallback defaults
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_your_razorpay_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_razorpay_key_secret}

# Monolith Integration
app.monolith.url=${MONOLITH_URL:http://localhost:5000/api}
app.internal.secret=${INTERNAL_API_SECRET:cdac_examind_secret_2026}

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Mail Configurations
spring.mail.properties.mail.smtp.localhost=localhost
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_mail_app_password_here}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true